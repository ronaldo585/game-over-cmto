<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Aluno - Game Over CMTO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>GAME OVER</h1>
        <p>CMTO</p>
    </header>

    <main>

        <div class="login-box">

            <h2>Área do Aluno</h2>

            <p>Entre na sua conta para continuar</p>

            <form id="formLoginAluno">

                <label for="email">E-mail escolar</label>

                <input
    type="email"
    id="email"
    placeholder="seuemail@escola.com"
    autocomplete="email"
    required
>

<label for="senha">Senha</label>

<input
    type="password"
    id="senha"
    placeholder="Digite sua senha"
    autocomplete="current-password"
    required
>
                <button type="submit">
                    ENTRAR
                </button>

            </form>

            <p class="cadastro">
                Ainda não possui uma conta?
                <a href="cadastro-aluno.html">Cadastre-se</a>
            </p>

            <a href="index.html" class="voltar">
                ← Voltar
            </a>

        </div>

    </main>
<script type="module" src="aluno.js"></script>
</body>

</html>

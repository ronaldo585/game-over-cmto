<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAT RUSH</title>

    <link rel="stylesheet" href="./cat-rush.css?v=20260923-1">
</head>

<body>

    <main class="game">

        <nav class="game-nav" aria-label="Navegação do jogo">
            <a href="../area-aluno.html">← Central de games</a>
            <span>DESVIE • COLETE • EVOLUA</span>
        </nav>

        <header>
            <div>
                <h1>🐱 CAT RUSH</h1>
                <p>NIGHT RUN</p>
            </div>

            <div class="recorde">
                🏆 RECORDE
                <strong id="recorde">0</strong>
            </div>
        </header>

        <div class="hud">

            <span class="hud-item">⭐ <b id="pontos">0</b><small>PONTOS</small></span>

            <span class="hud-item">🪙 <b id="moedas">0</b><small>MOEDAS</small></span>

            <span class="hud-vidas" aria-live="polite" aria-label="3 de 3 vidas">
                <span id="coracoes" class="coracoes" aria-hidden="true">♥♥♥</span>
                <span><b id="vidas">3/3</b><small>VIDAS</small></span>
            </span>

            <span class="hud-item">🗺️ <b id="faseHud">FASE 1</b><small>JORNADA</small></span>

        </div>

        <section class="especial-hud" aria-live="polite" aria-label="Energia do especial">
            <div class="especial-titulo">
                <span>⚡ ESPECIAL DO GATO</span>
                <b id="especialTexto">AGUARDANDO CHEFE</b>
            </div>
            <div class="especial-trilho" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="especialBarra" class="especial-barra"></div>
            </div>
        </section>

        <div class="game-wrapper">

            <canvas id="canvas"></canvas>

            <div id="mensagem" class="mensagem">

                <h2>🐱 CAT RUSH</h2>

                <p>
                    A noite começou.<br>
                    Agora é correr.
                </p>

                <button id="iniciar">
                    ▶ COMEÇAR
                </button>

            </div>

        </div>

        <div class="controles">

            <button id="pular">
                🐾 PULAR
            </button>

            <button id="especial" class="especial-botao" disabled>
                ⚡ ESPECIAL
            </button>

        </div>

        <p class="dica">
            ESPAÇO = PULAR • X = ATAQUE • Z = ESPECIAL (contra chefes)
        </p>

    </main>

    <script type="module" src="./cat-rush.js?v=20260923-1"></script>
    <script type="module" src="../alerta-adm.js?v=2"></script>

</body>

</html>
